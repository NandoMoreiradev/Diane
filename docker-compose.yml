services:
  postgres:
    image: postgres:16-alpine
    container_name: diane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diane
      POSTGRES_PASSWORD: diane_dev_password
      POSTGRES_DB: diane
    ports:
      - "5432:5432"
    volumes:
      - diane_pgdata:/var/lib/postgresql/data

volumes:
  diane_pgdata:
